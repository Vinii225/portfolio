name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build do site estático
        run: |
          echo "Iniciando o processo de build..."
          mkdir -p dist
          cp -r *.html dist/ 2>/dev/null || true
          cp -r css dist/ 2>/dev/null || true
          cp -r js dist/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true
          echo "Build concluído. Conteúdo gerado:"
          ls -la dist

      - name: Salvar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar artefato do build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist

      - name: Instalar htmlhint
        run: npm install -g htmlhint

      - name: Validar HTML (testes automatizados)
        run: |
          echo "Iniciando testes de validação do HTML..."
          htmlhint "dist/**/*.html" --config .htmlhintrc

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar artefato do build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
